<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Paracraft Camera</title>
    <style>
        #camera_refresh_container, #camera_show_container {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body style="margin: 0px; padding: 0px; overflow: hidden;">
    <div id="camera_refresh_container" style="position: fixed; top: 0px; left: 0px; right: 0px; height: 30px; z-index: 10;">
        <select id="camera_device_select" style="position: absolute; top: 0px; left: 0px; right: 80px; height: 30px;"></select>
        <button id="refresh_button" onclick="location.reload();" style="position: absolute; top: 0px; right: 0px; width: 80px; height: 30px;">刷新</button>
    </div>
    <div id="camera_show_container" style="position: fixed; bottom: 0px; left: 0px; right: 0px; height: 30px; z-index: 10;">
        <select id="current_camera_select" style="position: absolute; top: 0px; left: 0px; right: 0px; height: 30px;"></select>
    </div>
    <script>
        window.WEBPARACRAFT_VERSION = (new Date()).getTime().toString();
        window.WEBPARACRAFT_ORIGIN = window.location.origin + "/";
        window.chrome_webview = window.chrome && window.chrome.webview;   // 不可删除 当前window webview初始化, 删除可能导致window.chrome.webview不存在
        const script = document.createElement('script');
        script.src = window.WEBPARACRAFT_ORIGIN + "auto_generate_files/paracraft_sitefile_md5sums.js?hash=" + window.WEBPARACRAFT_VERSION;
        script.onload = function () {
            load_script_element({ path: "src/NPL.js" });
            load_script_element({ path: "camera/index.js" });
        }
        document.body.appendChild(script);
    </script>
</body>
</html>
